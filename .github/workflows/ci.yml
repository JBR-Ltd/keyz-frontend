name: CI

on:
  push:
    branches: [main, founder-1]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Fails rather than silently updating pnpm-lock.yaml, so CI builds exactly
      # what is committed
      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs before the build: next build does not fail on type errors in every
      # configuration, and a type error should never reach a deploy
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint src --max-warnings=0

      # API_BASE_URL is read at request time by the route handlers, not at build
      # time, so a placeholder is enough to build
      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: http://localhost:8080

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
